name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify publish tarballs
        run: pnpm pack:check

  headless-linux:
    name: Setup without a keyring (Linux)
    runs-on: ubuntu-latest
    container: node:22-bookworm
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Set up and reopen an encrypted file-backed vault
        shell: bash
        run: |
          set -euo pipefail
          export VAPI_HOME="$(mktemp -d)"
          export VAPI_VAULT_PASSWORD='ci-only-password-1234'
          export VAPI_REGISTRY_URL='http://127.0.0.1:1'
          export BASE_RPC_URL="$VAPI_REGISTRY_URL"
          trap 'rm -rf "$VAPI_HOME"' EXIT

          # Keep CI markers and stdin closed so the recovery phrase stays hidden.
          # Linking fails against the local registry; assert the vault separately.
          timeout 300 node packages/vapi-network/dist/cli.js setup --no-cloud-backup < /dev/null || true
          test "$(node -p 'require(process.env.VAPI_HOME + "/secret-store.json").backend')" = file
          test -f "$VAPI_HOME/vault.json"
          node -e 'const f=require(process.env.VAPI_HOME+"/secrets.json"); const e=f.entries["vault-key"]; if (!e || typeof e.ciphertext!=="string") process.exit(1)'
          test "$(stat -c %a "$VAPI_HOME/secrets.json")" = 600
          test "$(stat -c %a "$VAPI_HOME/secret-store.json")" = 600
          node packages/vapi-network/dist/cli.js accounts --json | grep -q '"address"'

          # Listing public addresses works while locked; adding an account needs the key.
          node packages/vapi-network/dist/cli.js accounts add unlocked-check --no-link --json | grep -q '"address"'
          if locked_output=$(env -u VAPI_VAULT_PASSWORD node packages/vapi-network/dist/cli.js accounts add locked-check --no-link --json 2>&1); then
            echo 'Expected account derivation to fail without VAPI_VAULT_PASSWORD.' >&2
            exit 1
          fi
          printf '%s\n' "$locked_output" | grep -q 'VAPI_VAULT_PASSWORD'

  windows:
    name: Secret store (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test against Windows PowerShell and DPAPI
        run: pnpm --filter @vapi-network/core exec vitest run src/secret-store.windows.test.ts

  desktop:
    name: vAPI Desktop (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Build native helpers
        run: pnpm --dir apps/desktop native:build

      - name: Typecheck desktop
        run: pnpm --dir apps/desktop typecheck

      - name: Test desktop
        run: pnpm --dir apps/desktop test

      - name: Check desktop copy
        run: pnpm --dir apps/desktop check:copy

      - name: Test desktop scripts
        run: node --test apps/desktop/scripts/*.test.mjs
