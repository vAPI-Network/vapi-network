name: GitHub release

# Pushing a tag such as v0.14.0 publishes a GitHub release whose notes are that
# version's section of CHANGELOG.md. npm publishing stays manual; see
# docs/releasing.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag against the package version
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package version $version." >&2
            exit 1
          fi

      - name: Read the release notes from CHANGELOG.md
        run: node scripts/changelog-section.mjs "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
