name: Feature request
description: New capability, source adapter, signer, or protocol support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: "What can't you do today, as an agent user or a provider?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal, description: "What should happen. If it's a source/signer, link the upstream spec or API." }
    validations: { required: true }
  - type: checkboxes
    id: invariants
    attributes:
      label: Invariants
      options:
        - label: This keeps keys and payments on the user's machine (no custody, no payment proxy)
          required: true
