name: New discovery source or signer
description: Propose a catalog to search or a wallet to sign with
labels: [source, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        A source is a catalog of many providers, such as a registry or an index. A single provider's API is listed with `vapi publish` and needs no change to the client.
  - type: input
    id: name
    attributes: { label: Name and URL }
    validations: { required: true }
  - type: textarea
    id: shape
    attributes:
      label: Read API or signing interface
      description: "Endpoint or spec link, auth needs, rate limits, listing fields available (resource, accepts, description, input schema)"
    validations: { required: true }
  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I can open the PR with tests against a recorded fixture
