blank_issues_enabled: false
contact_links:
  - name: Account, points and quests
    url: https://discord.gg/vapinetwork
    about: Maintainers cannot look up an account from a public issue. Ask on Discord.
  - name: Questions and ideas
    url: https://github.com/vAPI-Network/vapi-network/discussions
    about: Ask how something works or float an idea before it becomes an issue.
  - name: List your API on vAPI Call
    url: https://github.com/vAPI-Network/vapi-network/blob/main/docs/call.md#publish-an-api
    about: Listing is permissionless with `vapi publish`. No issue is needed.
  - name: Security report
    url: https://github.com/vAPI-Network/vapi-network/security/advisories/new
    about: Report a vulnerability privately. Do not open a public issue.
